%YAML 1.1
---
vars:
  address-groups:
    # The installer renders this from the selected appliance config. "any" is
    # retained in the source template solely for isolated offline replay.
    HOME_NET: "any"
    EXTERNAL_NET: "any"
default-rule-path: /etc/ngfw/inspection/rules
rule-files:
  - app-discovery.rules
  - ids-demo.rules
nflog:
  - group: 100
    # Bounded netlink receive headroom for concurrent full-size/GRO copies.
    # Tiny buffers can lose a TCP handshake before App-ID sees the request.
    buffer-size: 4194304
    max-size: 16777216
    qthreshold: 1
    qtimeout: 100
stream:
  inline: no
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/lib/ngfw/inspection/ids/eve.json
      types:
        - alert
        - flow
        - http
        - dns
        - tls
        - ssh
        - stats:
            totals: yes
            threads: no
unix-command:
  enabled: yes
  filename: /var/lib/ngfw/inspection/ids/control.sock
stats:
  enabled: yes
  interval: 2
logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
