[Service]
# The engine may assign its owned gate socket to the proxy group without
# granting CAP_CHOWN or granting the API access to this private IPC socket.
SupplementaryGroups=ngfw-proxy
# RuntimeDirectory is recreated at boot. Grant only directory traversal to
# the proxy; the management engine socket stays root:ngfw and mode 0660.
ExecStartPre=/usr/bin/setfacl -m u:ngfw-proxy:--x /run/ngfw
